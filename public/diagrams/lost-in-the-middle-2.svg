<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 429" width="880" height="429" role="img" aria-label="GPT-3.5-Turbo scored 56.1% with no documents, and scored lower with 20 documents when the answer sat in the middle."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">With the answer in the middle, documents hurt</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">Closed-book means answering with no documents at all,</text><text x="73.0" y="108.0" class="p-line" font-size="13">from what the model learned in training.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">GPT-3.5-TURBO, 20 DOCUMENTS</text><g class="p-card p-step"><rect x="22.0" y="174.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">No documents</text><text x="37.0" y="257.5" class="p-line" font-size="13">Closed-book score</text><text x="37.0" y="275.5" class="p-line" font-size="13">of 56.1%, with</text><text x="37.0" y="293.5" class="p-line" font-size="13">nothing to read</text></g><g class="p-card p-bad"><rect x="499.0" y="174.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="514.0" y="236.5" class="p-title" font-size="15.5">Answer in the middle</text><text x="514.0" y="257.5" class="p-line" font-size="13">The answer is in</text><text x="514.0" y="275.5" class="p-line" font-size="13">the input, and the</text><text x="514.0" y="293.5" class="p-line" font-size="13">score falls below 56.1%</text></g><path d="M440.0,182.0 L440.0,303.0" class="p-divider"/><rect x="386.4" y="231.5" width="107.1" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="246.5" class="p-note" text-anchor="middle" font-size="11.5">worse than none</text><g class="p-card p-muted"><rect x="22" y="337.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,361.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Zm-6.8-2.8l2-2m-5-1l2-2m-5-1l2-2m7 11l2-2"/></g><text x="73.0" y="367.0" class="p-line" font-size="13">Recall at five scores the middle-position run as a success, because the</text><text x="73.0" y="385.0" class="p-line" font-size="13">answer was retrieved. Only a check on position catches it.</text></g></svg>
