<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 538" width="880" height="538" role="img" aria-label="A float32 PyTorch graph and an 8-bit fixed-operator accelerator, the four tools that bridge them, and the fact that each is allowed to change the model silently."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Why a trained model cannot just run on the chip</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">THE TWO ENDS</text><g class="p-card p-step"><rect x="22.0" y="78.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="37.0" y="140.5" class="p-title" font-size="15.5">What you trained</text><text x="37.0" y="161.5" class="p-line" font-size="13">A convolutional model in PyTorch</text><text x="37.0" y="179.5" class="p-line" font-size="13">32-bit floating point</text><text x="37.0" y="197.5" class="p-line" font-size="13">Any operator the framework can express</text><text x="37.0" y="215.5" class="p-line" font-size="13">Shapes decided at runtime</text></g><g class="p-card p-step"><rect x="499.0" y="78.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10 12h4m-4 5h4M10 7h4m4 5h2m-2 6h2M18 6h2M4 12h2m-2 6h2M4 6h2"/><rect width="12" height="20" x="6" y="2" rx="2"/></g></g><text x="514.0" y="140.5" class="p-title" font-size="15.5">What the chip runs</text><text x="514.0" y="161.5" class="p-line" font-size="13">A fixed circuit, not a processor</text><text x="514.0" y="179.5" class="p-line" font-size="13">8-bit integers only</text><text x="514.0" y="197.5" class="p-line" font-size="13">A published operator list, and it is short</text><text x="514.0" y="215.5" class="p-line" font-size="13">Anything else it cannot execute</text></g><path d="M440.0,86.0 L440.0,225.0" class="p-divider"/><rect x="389.3" y="144.5" width="101.3" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="159.5" class="p-note" text-anchor="middle" font-size="11.5">no direct path</text><text x="22.0" y="270.0" class="p-band" font-size="11.5">SO FOUR TOOLS CLOSE THE GAP</text><g class="p-card p-step"><rect x="22.0" y="277.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,292.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5m-10 4.5L8 15l2 2.5m4-5l2 2.5l-2 2.5"/></g></g><text x="37.0" y="339.5" class="p-title" font-size="15.5">Export</text><text x="37.0" y="360.5" class="p-line" font-size="13">Code becomes</text><text x="37.0" y="378.5" class="p-line" font-size="13">a graph file</text></g><path d="M213.5,336.5 L233.5,336.5" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="238.5" y="277.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(253.5,292.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="4" height="6" x="14" y="14" rx="2"/><rect width="4" height="6" x="6" y="4" rx="2"/><path d="M6 20h4m4-10h4M6 14h2v6m6-16h2v6"/></g></g><text x="253.5" y="339.5" class="p-title" font-size="15.5">Convert</text><text x="253.5" y="360.5" class="p-line" font-size="13">Float becomes</text><text x="253.5" y="378.5" class="p-line" font-size="13">8-bit integer</text></g><path d="M430.0,336.5 L450.0,336.5" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="455.0" y="277.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(470.0,292.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12L12 12m8-8L8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8L20 20"/></g></g><text x="470.0" y="339.5" class="p-title" font-size="15.5">Compile</text><text x="470.0" y="360.5" class="p-line" font-size="13">Graph becomes</text><text x="470.0" y="378.5" class="p-line" font-size="13">the chip's operators</text></g><path d="M646.5,336.5 L666.5,336.5" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="671.5" y="277.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(686.5,292.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"/></g><text x="686.5" y="339.5" class="p-title" font-size="15.5">Run</text><text x="686.5" y="360.5" class="p-line" font-size="13">On real silicon,</text><text x="686.5" y="378.5" class="p-line" font-size="13">with real heat</text></g><text x="440.0" y="415.0" class="p-note" text-anchor="middle" font-size="11.5">Each tool hands its output to the next. None of them can see your source.</text><g class="p-card p-bad"><rect x="22" y="446.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,470.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="73.0" y="476.0" class="p-line" font-size="13">Every one of those four is permitted to change what your model computes.</text><text x="73.0" y="494.0" class="p-line" font-size="13">None of them is obliged to tell you, and none of them raises an error.</text></g></svg>
