<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 447" width="880" height="447" role="img" aria-label="Deciding whether a model is worth converting takes one cheap check, but reading the file the usual way requires installing the toolchain first, which is the decision the check was meant to inform."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">The cheap answer is locked behind the expensive setup</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">The question is small: walk the operators in order, look each one up in the</text><text x="73.0" y="108.0" class="p-line" font-size="13">chip's table, find the first miss. The answer decides whether to convert at all.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">TWO WAYS TO READ THE FILE</text><g class="p-card p-muted"><rect x="22.0" y="174.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></g></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">Install the stack</text><text x="37.0" y="257.5" class="p-line" font-size="13">The ONNX library, protobuf,</text><text x="37.0" y="275.5" class="p-line" font-size="13">and a chain of numerical packages</text><text x="37.0" y="293.5" class="p-line" font-size="13">Roughly a hundred megabytes</text><text x="37.0" y="311.5" class="p-line" font-size="13">Before you can ask anything</text></g><g class="p-card p-step"><rect x="499.0" y="174.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5m-10 4.5L8 15l2 2.5m4-5l2 2.5l-2 2.5"/></g></g><text x="514.0" y="236.5" class="p-title" font-size="15.5">Read the bytes</text><text x="514.0" y="257.5" class="p-line" font-size="13">Three protobuf field numbers</text><text x="514.0" y="275.5" class="p-line" font-size="13">and the standard library</text><text x="514.0" y="293.5" class="p-line" font-size="13">Sixty lines, no install</text><text x="514.0" y="311.5" class="p-line" font-size="13">Runs wherever Python runs</text></g><path d="M440.0,182.0 L440.0,321.0" class="p-divider"/><rect x="383.5" y="240.5" width="112.9" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="255.5" class="p-note" text-anchor="middle" font-size="11.5">one hour vs none</text><g class="p-card p-bad"><rect x="22" y="355.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,379.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="73.0" y="385.0" class="p-line" font-size="13">Gating the answer behind the setup inverts the decision: you pay the hour</text><text x="73.0" y="403.0" class="p-line" font-size="13">in order to find out whether the hour was worth paying.</text></g></svg>
