<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 411" width="880" height="411" role="img" aria-label="A device limits bytes held and bytes read rather than parameter count, so a 13B model at four bits and a 7B model at eight bits spend the same seven gigabytes."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Precision and model size are one decision, not two</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 12v-2m0 8v-2m4-4v-2m0 8v-2M2 11h1.5M20 18v-2m.5-5H22M4 18v-2m4-4v-2m0 8v-2"/><rect width="20" height="10" x="2" y="6" rx="2"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">What a device limits is physical: bytes held in memory, and bytes read</text><text x="73.0" y="108.0" class="p-line" font-size="13">to produce each token. A byte does not care which of the two you spend it on.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">ONE BUDGET, SPENT TWO WAYS</text><g class="p-card p-step"><rect x="22.0" y="174.0" width="359.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">13B at four bits</text><text x="37.0" y="257.5" class="p-line" font-size="13">Nearly twice the weights</text><text x="37.0" y="275.5" class="p-line" font-size="13">Half the precision on each</text></g><g class="p-card p-step"><rect x="499.0" y="174.0" width="359.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="4" height="6" x="14" y="14" rx="2"/><rect width="4" height="6" x="6" y="4" rx="2"/><path d="M6 20h4m4-10h4M6 14h2v6m6-16h2v6"/></g></g><text x="514.0" y="236.5" class="p-title" font-size="15.5">7B at eight bits</text><text x="514.0" y="257.5" class="p-line" font-size="13">Half the weights</text><text x="514.0" y="275.5" class="p-line" font-size="13">Twice the precision on each</text></g><path d="M440.0,182.0 L440.0,285.0" class="p-divider"/><rect x="403.9" y="222.5" width="72.3" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="237.5" class="p-note" text-anchor="middle" font-size="11.5">same 7 GB</text><g class="p-card p-step"><rect x="22" y="319.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,343.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Zm-6.8-2.8l2-2m-5-1l2-2m-5-1l2-2m7 11l2-2"/></g><text x="73.0" y="349.0" class="p-line" font-size="13">So the question is not which model is better. It is which of these two</text><text x="73.0" y="367.0" class="p-line" font-size="13">buys more accuracy for the same seven gigabytes.</text></g></svg>
