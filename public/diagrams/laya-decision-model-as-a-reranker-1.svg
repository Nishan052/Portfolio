<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 351" width="880" height="351" role="img" aria-label="Two cards compare the work per question: MiniLM reads 20 passages with 22.7 million parameters, Laya reads the same 20 with 421 million and does 37.8 times the arithmetic."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Twenty passes per question, and each Laya pass is far larger</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">A reranker reads the question with each passage in turn: 20 passages, 20 passes.</text><text x="73.0" y="108.0" class="p-line" font-size="13">Laya's 33 ms is one pass over a short ticket, on a data-centre T4 GPU.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">ONE QUESTION, 20 PASSAGES, APPLE M3 PROCESSOR</text><g class="p-card p-good"><rect x="22.0" y="174.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.914 4a1.5 1.5 0 0 0-2.474-1.561l-9 9A1.5 1.5 0 0 0 5.5 14h4.002a.5.5 0 0 1 .471.666L8.086 20a1.5 1.5 0 0 0 2.475 1.56l9-9A1.5 1.5 0 0 0 18.5 10h-3.997a.5.5 0 0 1-.472-.667z"/></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">MiniLM cross-encoder</text><text x="37.0" y="257.5" class="p-line" font-size="13">22.7 million parameters</text><text x="37.0" y="275.5" class="p-line" font-size="13">75.5 word-pieces a passage</text><text x="37.0" y="293.5" class="p-line" font-size="13">71.4 billion operations</text><text x="37.0" y="311.5" class="p-line" font-size="13">116 ms per question</text></g><g class="p-card p-bad"><rect x="499.0" y="174.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="514.0" y="236.5" class="p-title" font-size="15.5">Laya, English</text><text x="514.0" y="257.5" class="p-line" font-size="13">421 million parameters</text><text x="514.0" y="275.5" class="p-line" font-size="13">107 word-pieces a passage</text><text x="514.0" y="293.5" class="p-line" font-size="13">2,697 billion operations</text><text x="514.0" y="311.5" class="p-line" font-size="13">2,744 ms per question</text></g><path d="M440.0,182.0 L440.0,321.0" class="p-divider"/><rect x="371.9" y="240.5" width="136.2" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="255.5" class="p-note" text-anchor="middle" font-size="11.5">37.8x the arithmetic</text></svg>
