<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 504" width="880" height="504" role="img" aria-label="A claim of 30 tokens per second for a 7B model on a Raspberry Pi 5 is ten times over the 2.8 ceiling, while 2 tokens per second sits inside the expected range of 1.1 to 2.4."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Thirty tokens per second on a Pi 5 cannot be true</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">TWO CLAIMS ABOUT ONE BOARD</text><g class="p-card p-step"><rect x="246.0" y="78.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(261.0,93.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"/></g><text x="261.0" y="140.5" class="p-title" font-size="15.5">Raspberry Pi 5, 7B model at Q4</text><text x="261.0" y="161.5" class="p-line" font-size="13">17.1 GB/s and a 4,096-token context</text><text x="261.0" y="179.5" class="p-line" font-size="13">Ceiling 2.8 tokens/s, range 1.1 to 2.4</text></g><g class="p-card p-bad"><rect x="22.0" y="249.0" width="388.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,264.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="37.0" y="311.5" class="p-title" font-size="15.5">30 tokens per second</text><text x="37.0" y="332.5" class="p-line" font-size="13">Over the physical limit</text><text x="37.0" y="350.5" class="p-line" font-size="13">No measurement of the</text><text x="37.0" y="368.5" class="p-line" font-size="13">sixteen has ever done this</text></g><path d="M440.0,201.0 L216.0,243.0" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><rect x="262.9" y="213.0" width="130.2" height="18" rx="5" class="p-chip"/><text x="328.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">10x over the ceiling</text><g class="p-card p-good"><rect x="470.0" y="249.0" width="388.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(485.0,264.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="485.0" y="311.5" class="p-title" font-size="15.5">2 tokens per second</text><text x="485.0" y="332.5" class="p-line" font-size="13">Under the ceiling</text><text x="485.0" y="350.5" class="p-line" font-size="13">Inside the 38% to 85%</text><text x="485.0" y="368.5" class="p-line" font-size="13">band of the sixteen</text></g><path d="M440.0,201.0 L664.0,243.0" class="p-arrow" marker-end="url(#p-head)"/><rect x="498.5" y="213.0" width="106.9" height="18" rx="5" class="p-chip"/><text x="552.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">inside the range</text><g class="p-card p-step"><rect x="22" y="412.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,436.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="73.0" y="442.0" class="p-line" font-size="13">Over the ceiling is impossible, and under it is only possible.</text><text x="73.0" y="460.0" class="p-line" font-size="13">The band is what you plan around.</text></g></svg>
