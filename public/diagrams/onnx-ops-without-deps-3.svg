<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 486" width="880" height="486" role="img" aria-label="The reader is checked against the official ONNX library node for node on real model files, matching 100 percent of nodes, because a parser that is subtly wrong produces a confident answer about a model it never read correctly."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">The test is the artefact, not the sixty lines</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">TWO WAYS A PARSER CAN BE WRONG</text><g class="p-card p-step"><rect x="246.0" y="78.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(261.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5m-10 4.5L8 15l2 2.5m4-5l2 2.5l-2 2.5"/></g></g><text x="261.0" y="140.5" class="p-title" font-size="15.5">Sixty lines of stdlib Python</text><text x="261.0" y="161.5" class="p-line" font-size="13">Pull a header, split field number from wire type,</text><text x="261.0" y="179.5" class="p-line" font-size="13">record it or skip it by its declared width</text></g><g class="p-card p-good"><rect x="22.0" y="249.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,264.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="37.0" y="311.5" class="p-title" font-size="15.5">Checked against the reference</text><text x="37.0" y="332.5" class="p-line" font-size="13">Two real files, node for node,</text><text x="37.0" y="350.5" class="p-line" font-size="13">in order, asserted in the eval</text></g><path d="M440.0,201.0 L216.0,243.0" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><rect x="265.8" y="213.0" width="124.3" height="18" rx="5" class="p-chip"/><text x="328.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">100% of nodes match</text><g class="p-card p-bad"><rect x="470.0" y="249.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(485.0,264.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="485.0" y="311.5" class="p-title" font-size="15.5">Subtly wrong instead</text><text x="485.0" y="332.5" class="p-line" font-size="13">A partial list looks exactly</text><text x="485.0" y="350.5" class="p-line" font-size="13">like a correct one</text></g><path d="M440.0,201.0 L664.0,243.0" class="p-arrow" marker-end="url(#p-head)"/><rect x="475.3" y="213.0" width="153.4" height="18" rx="5" class="p-chip"/><text x="552.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">the failure that matters</text><g class="p-card p-step"><rect x="22" y="394.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,418.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Zm-6.8-2.8l2-2m-5-1l2-2m-5-1l2-2m7 11l2-2"/></g><text x="73.0" y="424.0" class="p-line" font-size="13">A parser that crashes is an inconvenience. One that is quietly wrong is a</text><text x="73.0" y="442.0" class="p-line" font-size="13">liability, because its answer about a model you never read looks right.</text></g></svg>
