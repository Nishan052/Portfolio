<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 357" width="880" height="357" role="img" aria-label="A strip of four results for the same 49 questions: keyword search 26, MiniLM 34, Laya 17, and Laya after a short fine-tune 27."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Trained for decisions, Laya ranked worse than plain search</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">MiniLM learned from search queries to put the answering passage above its near-duplicates.</text><text x="73.0" y="108.0" class="p-line" font-size="13">Laya learned honest yes or no odds for typed decisions, so it judged topic, not answer.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">RIGHT CHUNK RANKED FIRST, OUT OF 49 QUESTIONS</text><g class="p-card p-muted"><rect x="22.0" y="174.0" width="186.5" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">Keyword search</text><text x="37.0" y="257.5" class="p-line" font-size="13">26 of 49</text><text x="37.0" y="275.5" class="p-line" font-size="13">the order before</text><text x="37.0" y="293.5" class="p-line" font-size="13">any reranker</text></g><path d="M213.5,242.5 L233.5,242.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-good"><rect x="238.5" y="174.0" width="186.5" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(253.5,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="253.5" y="236.5" class="p-title" font-size="15.5">MiniLM</text><text x="253.5" y="257.5" class="p-line" font-size="13">34 of 49</text><text x="253.5" y="275.5" class="p-line" font-size="13">said yes to 2</text><text x="253.5" y="293.5" class="p-line" font-size="13">passages of 20</text></g><path d="M430.0,242.5 L450.0,242.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-bad"><rect x="455.0" y="174.0" width="186.5" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(470.0,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="470.0" y="236.5" class="p-title" font-size="15.5">Laya</text><text x="470.0" y="257.5" class="p-line" font-size="13">17 of 49</text><text x="470.0" y="275.5" class="p-line" font-size="13">said yes to 5,</text><text x="470.0" y="293.5" class="p-line" font-size="13">2 from other posts</text></g><path d="M646.5,242.5 L666.5,242.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="671.5" y="174.0" width="186.5" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(686.5,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Zm-6.8-2.8l2-2m-5-1l2-2m-5-1l2-2m7 11l2-2"/></g><text x="686.5" y="236.5" class="p-title" font-size="15.5">Laya, fine-tuned</text><text x="686.5" y="257.5" class="p-line" font-size="13">27 of 49</text><text x="686.5" y="275.5" class="p-line" font-size="13">level with search,</text><text x="686.5" y="293.5" class="p-line" font-size="13">short of MiniLM</text></g><text x="440.0" y="330.0" class="p-note" text-anchor="middle" font-size="11.5">Fine-tune: 280 seconds on 51 training questions, none from the test set.</text></svg>
