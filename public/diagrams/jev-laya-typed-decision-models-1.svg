<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 357" width="880" height="357" role="img" aria-label="An agent's ticket triage question sent to a text generator: four costs follow from writing one token at a time, ending in an answer with no usable confidence."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">A writing model pays four costs for a one-word decision</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">A language model writes one token at a time, and each waits for the last.</text><text x="73.0" y="108.0" class="p-line" font-size="13">Ask it which team owns a ticket, and it still writes its way to the answer.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">WHAT THAT COSTS ON EVERY DECISION CALL</text><g class="p-card p-step"><rect x="22.0" y="174.0" width="186.5" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">Time</text><text x="37.0" y="257.5" class="p-line" font-size="13">Seconds per call,</text><text x="37.0" y="275.5" class="p-line" font-size="13">often with reasoning</text><text x="37.0" y="293.5" class="p-line" font-size="13">written out first</text></g><path d="M213.5,242.5 L233.5,242.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-bad"><rect x="238.5" y="174.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(253.5,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="253.5" y="236.5" class="p-title" font-size="15.5">The menu</text><text x="253.5" y="257.5" class="p-line" font-size="13">It can name a tool</text><text x="253.5" y="275.5" class="p-line" font-size="13">you never defined</text></g><path d="M430.0,242.5 L450.0,242.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="455.0" y="174.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(470.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5m-10 4.5L8 15l2 2.5m4-5l2 2.5l-2 2.5"/></g></g><text x="470.0" y="236.5" class="p-title" font-size="15.5">Parsing</text><text x="470.0" y="257.5" class="p-line" font-size="13">A string your code</text><text x="470.0" y="275.5" class="p-line" font-size="13">must read and check</text></g><path d="M646.5,242.5 L666.5,242.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="671.5" y="174.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(686.5,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"/></g><text x="686.5" y="236.5" class="p-title" font-size="15.5">Confidence</text><text x="686.5" y="257.5" class="p-line" font-size="13">No usable sign</text><text x="686.5" y="275.5" class="p-line" font-size="13">of how sure it is</text></g><text x="440.0" y="330.0" class="p-note" text-anchor="middle" font-size="11.5">Confidence after post-training: OpenAI, GPT-4 Technical Report, 2023.</text></svg>
