<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 339" width="880" height="339" role="img" aria-label="One answer-bearing document moved through every position among 10, 20 or 30, with accuracy highest at the start, high at the end, and more than twenty points lower in the middle."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">The same document, moved, gives a U</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">Each question came with 10, 20 or 30 documents, and exactly one held the answer.</text><text x="73.0" y="108.0" class="p-line" font-size="13">The researchers moved that one document through every position and kept the rest fixed.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">WHERE THE ANSWER SITS, AND WHAT THE MODEL DOES WITH IT</text><g class="p-card p-good"><rect x="22.0" y="174.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">First</text><text x="37.0" y="257.5" class="p-line" font-size="13">Highest accuracy</text><text x="37.0" y="275.5" class="p-line" font-size="13">of any position</text></g><path d="M285.7,233.5 L305.7,233.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-bad"><rect x="310.7" y="174.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(325.7,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="325.7" y="236.5" class="p-title" font-size="15.5">Middle</text><text x="325.7" y="257.5" class="p-line" font-size="13">More than 20 points</text><text x="325.7" y="275.5" class="p-line" font-size="13">lower, same document</text></g><path d="M574.3,233.5 L594.3,233.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="599.3" y="174.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(614.3,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="614.3" y="236.5" class="p-title" font-size="15.5">Last</text><text x="614.3" y="257.5" class="p-line" font-size="13">High again, at the</text><text x="614.3" y="275.5" class="p-line" font-size="13">other edge it reads</text></g><text x="440.0" y="312.0" class="p-note" text-anchor="middle" font-size="11.5">Liu et al., TACL 2024: GPT-3.5-Turbo, Claude-1.3, MPT-30B-Instruct, LongChat-13B.</text></svg>
