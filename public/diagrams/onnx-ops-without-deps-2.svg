<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 339" width="880" height="339" role="img" aria-label="Field seven of the model message holds the graph, field one of the graph repeats once per node, and field four of a node carries its operator type as a string."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Three field numbers, and everything else skipped by length</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">THE WHOLE PATH THROUGH THE FILE</text><g class="p-card p-step"><rect x="22.0" y="78.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></g></g><text x="37.0" y="140.5" class="p-title" font-size="15.5">The file</text><text x="37.0" y="161.5" class="p-line" font-size="13">A protobuf message,</text><text x="37.0" y="179.5" class="p-line" font-size="13">no schema needed</text></g><path d="M213.5,137.5 L233.5,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="238.5" y="78.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(253.5,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g></g><text x="253.5" y="140.5" class="p-title" font-size="15.5">Field 7</text><text x="253.5" y="161.5" class="p-line" font-size="13">The graph</text><text x="253.5" y="179.5" class="p-line" font-size="13">inside the model</text></g><path d="M430.0,137.5 L450.0,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="455.0" y="78.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(470.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="470.0" y="140.5" class="p-title" font-size="15.5">Field 1</text><text x="470.0" y="161.5" class="p-line" font-size="13">Repeats once</text><text x="470.0" y="179.5" class="p-line" font-size="13">per node</text></g><path d="M646.5,137.5 L666.5,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-good"><rect x="671.5" y="78.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(686.5,93.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2m4-5h10"/></g><text x="686.5" y="140.5" class="p-title" font-size="15.5">Field 4</text><text x="686.5" y="161.5" class="p-line" font-size="13">The operator type,</text><text x="686.5" y="179.5" class="p-line" font-size="13">as a string</text></g><text x="440.0" y="216.0" class="p-note" text-anchor="middle" font-size="11.5">Every value carries a header packing a field number and a wire type, and the wire type gives its length. Anything you do not recognise, you step over.</text><g class="p-card p-step"><rect x="22" y="247.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,271.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="73.0" y="277.0" class="p-line" font-size="13">Repeated fields are written in sequence, so reading them in file order gives</text><text x="73.0" y="295.0" class="p-line" font-size="13">the nodes in graph order. No sorting, no index, no pass over the edges.</text></g></svg>
