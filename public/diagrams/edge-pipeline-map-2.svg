<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 592" width="880" height="592" role="img" aria-label="The exporter fuses, folds and renames, so one block of your code can leave as six operations under names you never chose, and that file is what every later tool reads."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Export does not save your model, it rewrites it</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2m4-5h10"/></g><text x="73.0" y="90.0" class="p-line" font-size="13">The next tool in the chain cannot read PyTorch. It reads a file.</text><text x="73.0" y="108.0" class="p-line" font-size="13">So the model is exported to ONNX, and export is not a save.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">THREE PASSES RUN INSIDE IT</text><g class="p-card p-step"><rect x="22.0" y="174.0" width="264.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">Fuses</text><text x="37.0" y="257.5" class="p-line" font-size="13">Normalisation layers</text><text x="37.0" y="275.5" class="p-line" font-size="13">disappear into the</text><text x="37.0" y="293.5" class="p-line" font-size="13">convolution before them</text></g><g class="p-card p-step"><rect x="308.0" y="174.0" width="264.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(323.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="4" height="6" x="14" y="14" rx="2"/><rect width="4" height="6" x="6" y="4" rx="2"/><path d="M6 20h4m4-10h4M6 14h2v6m6-16h2v6"/></g></g><text x="323.0" y="236.5" class="p-title" font-size="15.5">Folds</text><text x="323.0" y="257.5" class="p-line" font-size="13">Anything computable</text><text x="323.0" y="275.5" class="p-line" font-size="13">at export time becomes</text><text x="323.0" y="293.5" class="p-line" font-size="13">a stored constant</text></g><g class="p-card p-step"><rect x="594.0" y="174.0" width="264.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(609.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5m-10 4.5L8 15l2 2.5m4-5l2 2.5l-2 2.5"/></g></g><text x="609.0" y="236.5" class="p-title" font-size="15.5">Renames</text><text x="609.0" y="257.5" class="p-line" font-size="13">Patterns are rewritten</text><text x="609.0" y="275.5" class="p-line" font-size="13">into whichever</text><text x="609.0" y="293.5" class="p-line" font-size="13">equivalents it prefers</text></g><text x="22.0" y="348.0" class="p-band" font-size="11.5">WHAT GOES IN, WHAT COMES OUT</text><g class="p-card p-step"><rect x="22.0" y="355.0" width="359.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,370.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="37.0" y="417.5" class="p-title" font-size="15.5">One block you wrote</text><text x="37.0" y="438.5" class="p-line" font-size="13">Named in your source</text><text x="37.0" y="456.5" class="p-line" font-size="13">Findable with a search</text></g><g class="p-card p-bad"><rect x="499.0" y="355.0" width="359.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,370.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="514.0" y="417.5" class="p-title" font-size="15.5">Six operations in the file</text><text x="514.0" y="438.5" class="p-line" font-size="13">Named by the exporter</text><text x="514.0" y="456.5" class="p-line" font-size="13">Absent from your source</text></g><path d="M440.0,363.0 L440.0,466.0" class="p-divider"/><rect x="401.0" y="403.5" width="78.1" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="418.5" class="p-note" text-anchor="middle" font-size="11.5">same maths</text><g class="p-card p-bad"><rect x="22" y="500.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,524.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="73.0" y="530.0" class="p-line" font-size="13">From here on every tool reasons about the file, not about your code.</text><text x="73.0" y="548.0" class="p-line" font-size="13">When the compiler rejects an operator, searching your source finds nothing.</text></g></svg>
