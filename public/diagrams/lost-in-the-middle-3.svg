<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 504" width="880" height="504" role="img" aria-label="Five passages ranked one to five are usually sent in rank order, which puts the second and third best in the middle. Sent as one, three, five, four, two, the two best sit at the edges."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Rank first, then put the best at the edges</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">A reranker sends passages in rank order, so the second and third best land</text><text x="73.0" y="108.0" class="p-line" font-size="13">in slots two and three of five, inside the middle the model reads least.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">THE SAME FIVE RANKED PASSAGES, TWO ARRANGEMENTS</text><g class="p-card p-step"><rect x="246.0" y="174.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(261.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g></g><text x="261.0" y="236.5" class="p-title" font-size="15.5">Ranked 1 to 5</text><text x="261.0" y="257.5" class="p-line" font-size="13">Retrieval and reranking</text><text x="261.0" y="275.5" class="p-line" font-size="13">are the same in both</text></g><g class="p-card p-bad"><rect x="22.0" y="345.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,360.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="37.0" y="407.5" class="p-title" font-size="15.5">Sent as 1, 2, 3, 4, 5</text><text x="37.0" y="428.5" class="p-line" font-size="13">Second and third</text><text x="37.0" y="446.5" class="p-line" font-size="13">best sit in the middle</text></g><path d="M440.0,297.0 L216.0,339.0" class="p-arrow" marker-end="url(#p-head)"/><rect x="292.0" y="309.0" width="72.1" height="18" rx="5" class="p-chip"/><text x="328.0" y="322.0" class="p-note" text-anchor="middle" font-size="11.5">rank order</text><g class="p-card p-good"><rect x="470.0" y="345.0" width="388.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(485.0,360.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="485.0" y="407.5" class="p-title" font-size="15.5">Sent as 1, 3, 5, 4, 2</text><text x="485.0" y="428.5" class="p-line" font-size="13">Best first, second</text><text x="485.0" y="446.5" class="p-line" font-size="13">best last, weakest</text><text x="485.0" y="464.5" class="p-line" font-size="13">in the middle</text></g><path d="M440.0,297.0 L664.0,339.0" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><rect x="516.0" y="309.0" width="72.1" height="18" rx="5" class="p-chip"/><text x="552.0" y="322.0" class="p-note" text-anchor="middle" font-size="11.5">edge order</text></svg>
