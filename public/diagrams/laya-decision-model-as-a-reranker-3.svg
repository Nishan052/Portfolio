<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 315" width="880" height="315" role="img" aria-label="Four speed-ups for Laya on the M3 processor compared with 20 passages: ONNX Runtime at 8 bits ran 1.7 times slower, the Apple GPU 1.47 times faster, the multilingual checkpoint 2.56 times faster, and reranking only the top 5 4.5 times faster with more right answers."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Fewer candidates beat every other way to speed Laya up</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">EACH AGAINST PLAIN LAYA ON 20 PASSAGES IN THE SAME RUN, 17 OF 49 RIGHT</text><g class="p-card p-bad"><rect x="22.0" y="78.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="4" height="6" x="14" y="14" rx="2"/><rect width="4" height="6" x="6" y="4" rx="2"/><path d="M6 20h4m4-10h4M6 14h2v6m6-16h2v6"/></g></g><text x="37.0" y="140.5" class="p-title" font-size="15.5">ONNX, 8-bit</text><text x="37.0" y="161.5" class="p-line" font-size="13">1.7 times slower</text><text x="37.0" y="179.5" class="p-line" font-size="13">11 of 49 first</text></g><path d="M213.5,137.5 L233.5,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="238.5" y="78.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(253.5,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10 12h4m-4 5h4M10 7h4m4 5h2m-2 6h2M18 6h2M4 12h2m-2 6h2M4 6h2"/><rect width="12" height="20" x="6" y="2" rx="2"/></g></g><text x="253.5" y="140.5" class="p-title" font-size="15.5">Apple GPU</text><text x="253.5" y="161.5" class="p-line" font-size="13">1.47 times faster</text><text x="253.5" y="179.5" class="p-line" font-size="13">MiniLM gained 2.33</text></g><path d="M430.0,137.5 L450.0,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="455.0" y="78.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(470.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="470.0" y="140.5" class="p-title" font-size="15.5">Multilingual</text><text x="470.0" y="161.5" class="p-line" font-size="13">2.56 times faster</text><text x="470.0" y="179.5" class="p-line" font-size="13">17 of 49 first</text></g><path d="M646.5,137.5 L666.5,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-good"><rect x="671.5" y="78.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(686.5,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12L12 12m8-8L8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8L20 20"/></g></g><text x="686.5" y="140.5" class="p-title" font-size="15.5">Top 5 only</text><text x="686.5" y="161.5" class="p-line" font-size="13">4.5 times faster</text><text x="686.5" y="179.5" class="p-line" font-size="13">26 of 49 first</text></g><g class="p-card p-muted"><rect x="22" y="223.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,247.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="73.0" y="253.0" class="p-line" font-size="13">Fewer passages leave fewer on-topic chunks from other posts to outrank the right one.</text><text x="73.0" y="271.0" class="p-line" font-size="13">The cut-off of 5 was read off these same 49 questions, so test it on your own data.</text></g></svg>
