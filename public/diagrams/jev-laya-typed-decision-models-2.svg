<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 429" width="880" height="429" role="img" aria-label="A strip from fine-tuned classifiers, through prompted language models, structured output modes and label probabilities, to typed decision models."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Each fix kept one property and lost another</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">A decision step wants two things at once: answer a question it was never</text><text x="73.0" y="108.0" class="p-line" font-size="13">trained on, and reply fast with a probability that code can act on.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">HOW THE DECISION STEP MOVED, 2020 TO 2026</text><g class="p-card p-muted"><rect x="22.0" y="174.0" width="186.5" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">Classifier</text><text x="37.0" y="257.5" class="p-line" font-size="13">Fast, and it gave</text><text x="37.0" y="275.5" class="p-line" font-size="13">a probability. One</text><text x="37.0" y="293.5" class="p-line" font-size="13">training run each.</text></g><path d="M213.5,242.5 L233.5,242.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="238.5" y="174.0" width="186.5" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(253.5,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="253.5" y="236.5" class="p-title" font-size="15.5">Prompted model</text><text x="253.5" y="257.5" class="p-line" font-size="13">Any question in words.</text><text x="253.5" y="275.5" class="p-line" font-size="13">Slow, and no</text><text x="253.5" y="293.5" class="p-line" font-size="13">usable confidence.</text></g><path d="M430.0,242.5 L450.0,242.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="455.0" y="174.0" width="186.5" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(470.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5m-10 4.5L8 15l2 2.5m4-5l2 2.5l-2 2.5"/></g></g><text x="470.0" y="236.5" class="p-title" font-size="15.5">Output patches</text><text x="470.0" y="257.5" class="p-line" font-size="13">Fixed format, or label</text><text x="470.0" y="275.5" class="p-line" font-size="13">probabilities. Full</text><text x="470.0" y="293.5" class="p-line" font-size="13">generation cost stays.</text></g><path d="M646.5,242.5 L666.5,242.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-good"><rect x="671.5" y="174.0" width="186.5" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(686.5,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="686.5" y="236.5" class="p-title" font-size="15.5">Typed decision</text><text x="686.5" y="257.5" class="p-line" font-size="13">Any question, one pass,</text><text x="686.5" y="275.5" class="p-line" font-size="13">one option with</text><text x="686.5" y="293.5" class="p-line" font-size="13">a probability.</text></g><g class="p-card p-good"><rect x="22" y="337.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,361.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M16 3h5v5M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3m12 6l6-6"/></g></g><text x="73.0" y="367.0" class="p-line" font-size="13">Jev and Laya, September 2026: a prompted model's reach,</text><text x="73.0" y="385.0" class="p-line" font-size="13">with a classifier's reply.</text></g></svg>
