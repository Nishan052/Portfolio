<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 351" width="880" height="351" role="img" aria-label="A support table invites you to count unsupported operators, but the Edge TPU compiler walks the graph in order and stops at the first one it cannot execute, producing exactly one accelerated section per model."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">The compiler is not scoring your model against a list</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">TWO WAYS TO READ A SUPPORT TABLE</text><g class="p-card p-muted"><rect x="22.0" y="78.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="37.0" y="140.5" class="p-title" font-size="15.5">What a checklist asks</text><text x="37.0" y="161.5" class="p-line" font-size="13">How many operators are missing?</text><text x="37.0" y="179.5" class="p-line" font-size="13">Answer: a count, and a list</text><text x="37.0" y="197.5" class="p-line" font-size="13">Implies: fix them all</text><text x="37.0" y="215.5" class="p-line" font-size="13">Every miss looks equally expensive</text></g><g class="p-card p-step"><rect x="499.0" y="78.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M16 3h5v5M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3m12 6l6-6"/></g></g><text x="514.0" y="140.5" class="p-title" font-size="15.5">What the compiler asks</text><text x="514.0" y="161.5" class="p-line" font-size="13">Where do I have to stop?</text><text x="514.0" y="179.5" class="p-line" font-size="13">Answer: one index into the graph</text><text x="514.0" y="197.5" class="p-line" font-size="13">Implies: fix the earliest one</text><text x="514.0" y="215.5" class="p-line" font-size="13">Only the first miss costs anything</text></g><path d="M440.0,86.0 L440.0,225.0" class="p-divider"/><rect x="374.8" y="144.5" width="130.3" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="159.5" class="p-note" text-anchor="middle" font-size="11.5">different questions</text><g class="p-card p-bad"><rect x="22" y="259.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,283.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="73.0" y="289.0" class="p-line" font-size="13">One contiguous accelerated section per model. The compiler does not resume</text><text x="73.0" y="307.0" class="p-line" font-size="13">after the split, and it does not collect the supported operators further along.</text></g></svg>
