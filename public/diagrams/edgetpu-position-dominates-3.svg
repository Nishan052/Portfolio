<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 571" width="880" height="571" role="img" aria-label="Putting the unsupported operator at the end of the exported graph turns the split from an accident into a design decision, and three moves follow from it at export time."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">The unsupported operator does not have to go, only move</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">WHERE YOU PUT IT DECIDES WHAT IT COSTS</text><g class="p-card p-step"><rect x="246.0" y="78.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(261.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12L12 12m8-8L8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8L20 20"/></g></g><text x="261.0" y="140.5" class="p-title" font-size="15.5">The one operator the chip cannot run</text><text x="261.0" y="161.5" class="p-line" font-size="13">Non-maximum suppression, a custom activation,</text><text x="261.0" y="179.5" class="p-line" font-size="13">a reshape the converter would not fold</text></g><g class="p-card p-bad"><rect x="22.0" y="249.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,264.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="37.0" y="311.5" class="p-title" font-size="15.5">Left near the front</text><text x="37.0" y="332.5" class="p-line" font-size="13">Everything expensive</text><text x="37.0" y="350.5" class="p-line" font-size="13">sits behind the split</text></g><path d="M440.0,201.0 L216.0,243.0" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><rect x="271.6" y="213.0" width="112.7" height="18" rx="5" class="p-chip"/><text x="328.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">found by accident</text><g class="p-card p-good"><rect x="470.0" y="249.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(485.0,264.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g></g><text x="485.0" y="311.5" class="p-title" font-size="15.5">Moved to the end</text><text x="485.0" y="332.5" class="p-line" font-size="13">The split takes nothing</text><text x="485.0" y="350.5" class="p-line" font-size="13">with it</text></g><path d="M440.0,201.0 L664.0,243.0" class="p-arrow" marker-end="url(#p-head)"/><rect x="495.6" y="213.0" width="112.7" height="18" rx="5" class="p-chip"/><text x="552.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">decided at export</text><text x="22.0" y="405.0" class="p-band" font-size="11.5">THREE MOVES, ALL MADE AT EXPORT TIME</text><g class="p-card p-step"><rect x="22.0" y="412.0" width="264.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,427.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="37.0" y="474.5" class="p-title" font-size="15.5">Export the backbone alone</text><text x="37.0" y="495.5" class="p-line" font-size="13">Let it map completely,</text><text x="37.0" y="513.5" class="p-line" font-size="13">and merge boxes in</text><text x="37.0" y="531.5" class="p-line" font-size="13">application code</text></g><g class="p-card p-step"><rect x="308.0" y="412.0" width="264.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(323.0,427.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></g></g><text x="323.0" y="474.5" class="p-title" font-size="15.5">Reorder, do not remove</text><text x="323.0" y="495.5" class="p-line" font-size="13">An unusual layer is</text><text x="323.0" y="513.5" class="p-line" font-size="13">not a problem if</text><text x="323.0" y="531.5" class="p-line" font-size="13">it is late</text></g><g class="p-card p-step"><rect x="594.0" y="412.0" width="264.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(609.0,427.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2m4-5h10"/></g><text x="609.0" y="474.5" class="p-title" font-size="15.5">Walk before converting</text><text x="609.0" y="495.5" class="p-line" font-size="13">The first miss is</text><text x="609.0" y="513.5" class="p-line" font-size="13">knowable before any</text><text x="609.0" y="531.5" class="p-line" font-size="13">toolchain is installed</text></g></svg>
