<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 649" width="880" height="649" role="img" aria-label="The Edge TPU takes one contiguous run of operators, so the first unsupported one ends the accelerated section and everything after it runs on the CPU. A LeakyReLU at index one of fifteen strands 93 percent of the graph."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">One missing operator, and position decides the damage</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M16 3h5v5M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3m12 6l6-6"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">The accelerator takes one contiguous run of operators and nothing else.</text><text x="73.0" y="108.0" class="p-line" font-size="13">Not the supported ones scattered through the graph. One run.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">SO THE COMPILER CUTS AT THE FIRST GAP</text><g class="p-card p-step"><rect x="246.0" y="174.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(261.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5m-10 4.5L8 15l2 2.5m4-5l2 2.5l-2 2.5"/></g></g><text x="261.0" y="236.5" class="p-title" font-size="15.5">The compiled graph</text><text x="261.0" y="257.5" class="p-line" font-size="13">Checked operator by operator</text><text x="261.0" y="275.5" class="p-line" font-size="13">against the chip's list</text></g><g class="p-card p-good"><rect x="22.0" y="345.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,360.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10 12h4m-4 5h4M10 7h4m4 5h2m-2 6h2M18 6h2M4 12h2m-2 6h2M4 6h2"/><rect width="12" height="20" x="6" y="2" rx="2"/></g></g><text x="37.0" y="407.5" class="p-title" font-size="15.5">Runs on the accelerator</text><text x="37.0" y="428.5" class="p-line" font-size="13">The contiguous run,</text><text x="37.0" y="446.5" class="p-line" font-size="13">however short it is</text></g><path d="M440.0,297.0 L216.0,339.0" class="p-arrow" marker-end="url(#p-head)"/><rect x="248.4" y="309.0" width="159.2" height="18" rx="5" class="p-chip"/><text x="328.0" y="322.0" class="p-note" text-anchor="middle" font-size="11.5">everything before the gap</text><g class="p-card p-bad"><rect x="470.0" y="345.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(485.0,360.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 20v2m0-20v2m5 16v2m0-20v2M2 12h2m-2 5h2M2 7h2m16 5h2m-2 5h2M20 7h2M7 20v2M7 2v2"/><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/></g></g><text x="485.0" y="407.5" class="p-title" font-size="15.5">Runs on the processor</text><text x="485.0" y="428.5" class="p-line" font-size="13">The whole tail of the</text><text x="485.0" y="446.5" class="p-line" font-size="13">network, silently</text></g><path d="M440.0,297.0 L664.0,339.0" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><rect x="475.3" y="309.0" width="153.4" height="18" rx="5" class="p-chip"/><text x="552.0" y="322.0" class="p-note" text-anchor="middle" font-size="11.5">one unsupported operator</text><text x="22.0" y="501.0" class="p-band" font-size="11.5">THE SAME OPERATOR, TWO POSITIONS</text><g class="p-card p-bad"><rect x="22.0" y="508.0" width="359.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,523.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="37.0" y="570.5" class="p-title" font-size="15.5">LeakyReLU at index 1 of 15</text><text x="37.0" y="591.5" class="p-line" font-size="13">Strands 93% of the graph</text><text x="37.0" y="609.5" class="p-line" font-size="13">on the ordinary processor</text></g><g class="p-card p-good"><rect x="499.0" y="508.0" width="359.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,523.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Zm-6.8-2.8l2-2m-5-1l2-2m-5-1l2-2m7 11l2-2"/></g><text x="514.0" y="570.5" class="p-title" font-size="15.5">The same operator at the end</text><text x="514.0" y="591.5" class="p-line" font-size="13">Strands 7%</text><text x="514.0" y="609.5" class="p-line" font-size="13">Nothing else changed</text></g><path d="M440.0,516.0 L440.0,619.0" class="p-divider"/><rect x="403.9" y="556.5" width="72.3" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="571.5" class="p-note" text-anchor="middle" font-size="11.5">93% vs 7%</text></svg>
