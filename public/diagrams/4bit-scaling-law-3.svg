<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 504" width="880" height="504" role="img" aria-label="Fewer bits means both a smaller footprint, which is what the scaling law measured, and fewer bytes read per token, which is a separate bandwidth effect. Both improve at once, which is why they get conflated."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Cutting bits does two things, and this is only one</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">ONE CUT, TWO UNRELATED CONSEQUENCES</text><g class="p-card p-step"><rect x="246.0" y="78.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(261.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="4" height="6" x="14" y="14" rx="2"/><rect width="4" height="6" x="6" y="4" rx="2"/><path d="M6 20h4m4-10h4M6 14h2v6m6-16h2v6"/></g></g><text x="261.0" y="140.5" class="p-title" font-size="15.5">Fewer bits per weight</text><text x="261.0" y="161.5" class="p-line" font-size="13">Every weight is stored</text><text x="261.0" y="179.5" class="p-line" font-size="13">in less memory</text></g><g class="p-card p-good"><rect x="22.0" y="249.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,264.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Zm-6.8-2.8l2-2m-5-1l2-2m-5-1l2-2m7 11l2-2"/></g><text x="37.0" y="311.5" class="p-title" font-size="15.5">A larger model fits</text><text x="37.0" y="332.5" class="p-line" font-size="13">Accuracy per bit stored.</text><text x="37.0" y="350.5" class="p-line" font-size="13">This is the result above.</text></g><path d="M440.0,201.0 L216.0,243.0" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><rect x="260.0" y="213.0" width="136.0" height="18" rx="5" class="p-chip"/><text x="328.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">what the law measured</text><g class="p-card p-muted"><rect x="470.0" y="249.0" width="388.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(485.0,264.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.914 4a1.5 1.5 0 0 0-2.474-1.561l-9 9A1.5 1.5 0 0 0 5.5 14h4.002a.5.5 0 0 1 .471.666L8.086 20a1.5 1.5 0 0 0 2.475 1.56l9-9A1.5 1.5 0 0 0 18.5 10h-3.997a.5.5 0 0 1-.472-.667z"/></g><text x="485.0" y="311.5" class="p-title" font-size="15.5">A higher speed ceiling</text><text x="485.0" y="332.5" class="p-line" font-size="13">Bytes read per token halve,</text><text x="485.0" y="350.5" class="p-line" font-size="13">so the bandwidth ceiling</text><text x="485.0" y="368.5" class="p-line" font-size="13">roughly doubles.</text></g><path d="M440.0,201.0 L664.0,243.0" class="p-arrow" marker-end="url(#p-head)"/><rect x="489.8" y="213.0" width="124.3" height="18" rx="5" class="p-chip"/><text x="552.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">separate arithmetic</text><g class="p-card p-bad"><rect x="22" y="412.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,436.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="73.0" y="442.0" class="p-line" font-size="13">Both improve the moment you cut precision, which is exactly why one gets</text><text x="73.0" y="460.0" class="p-line" font-size="13">credited for the other. Part five takes the bandwidth arithmetic apart.</text></g></svg>
