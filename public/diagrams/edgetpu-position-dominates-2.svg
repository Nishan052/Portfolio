<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 424" width="880" height="424" role="img" aria-label="A LeakyReLU at index one of a fifteen-operator backbone strands 93 percent of the graph on the CPU. The same operator at the end strands 7 percent."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Same operator, same count, ten times the difference</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">THE COMPILER WALKS IN ORDER</text><g class="p-card p-good"><rect x="22.0" y="78.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5m-10 4.5L8 15l2 2.5m4-5l2 2.5l-2 2.5"/></g></g><text x="37.0" y="140.5" class="p-title" font-size="15.5">Op 0</text><text x="37.0" y="161.5" class="p-line" font-size="13">Convolution</text><text x="37.0" y="179.5" class="p-line" font-size="13">Accelerated</text></g><path d="M285.7,137.5 L305.7,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-bad"><rect x="310.7" y="78.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(325.7,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="325.7" y="140.5" class="p-title" font-size="15.5">Op 1</text><text x="325.7" y="161.5" class="p-line" font-size="13">LeakyReLU</text><text x="325.7" y="179.5" class="p-line" font-size="13">Not on the list</text></g><path d="M574.3,137.5 L594.3,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="599.3" y="78.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(614.3,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 20v2m0-20v2m5 16v2m0-20v2M2 12h2m-2 5h2M2 7h2m16 5h2m-2 5h2M20 7h2M7 20v2M7 2v2"/><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/></g></g><text x="614.3" y="140.5" class="p-title" font-size="15.5">Ops 2 to 14</text><text x="614.3" y="161.5" class="p-line" font-size="13">Every convolution left</text><text x="614.3" y="179.5" class="p-line" font-size="13">On the processor</text></g><text x="440.0" y="216.0" class="p-note" text-anchor="middle" font-size="11.5">Fifteen operators. The chip implements PReLU but not LeakyReLU, and the first one sits at index 1.</text><text x="22.0" y="258.0" class="p-band" font-size="11.5">MOVE IT, CHANGE NOTHING ELSE</text><g class="p-card p-bad"><rect x="22.0" y="265.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,280.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="37.0" y="327.5" class="p-title" font-size="15.5">LeakyReLU at index 1</text><text x="37.0" y="348.5" class="p-line" font-size="13">14 of 15 operators stranded</text><text x="37.0" y="366.5" class="p-line" font-size="13">Including every convolution</text><text x="37.0" y="384.5" class="p-line" font-size="13">The chip does almost nothing</text></g><g class="p-card p-good"><rect x="499.0" y="265.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,280.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10 12h4m-4 5h4M10 7h4m4 5h2m-2 6h2M18 6h2M4 12h2m-2 6h2M4 6h2"/><rect width="12" height="20" x="6" y="2" rx="2"/></g></g><text x="514.0" y="327.5" class="p-title" font-size="15.5">LeakyReLU at the end</text><text x="514.0" y="348.5" class="p-line" font-size="13">The backbone maps completely</text><text x="514.0" y="366.5" class="p-line" font-size="13">Only the tail is stranded</text><text x="514.0" y="384.5" class="p-line" font-size="13">The chip does almost everything</text></g><path d="M440.0,273.0 L440.0,394.0" class="p-divider"/><rect x="403.9" y="322.5" width="72.3" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="337.5" class="p-note" text-anchor="middle" font-size="11.5">93% vs 7%</text></svg>
