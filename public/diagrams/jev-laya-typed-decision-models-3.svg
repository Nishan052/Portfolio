<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 522" width="880" height="522" role="img" aria-label="A ticket and a typed question go into one pass, which returns one allowed option and its probability, and code either acts or escalates on a threshold."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">One pass returns your option and how sure it is</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5m-10 4.5L8 15l2 2.5m4-5l2 2.5l-2 2.5"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">You write the possible answers before the call: billing, shipping or refunds.</text><text x="73.0" y="108.0" class="p-line" font-size="13">The model can only score those, so an answer off the list cannot occur.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">THE SAME TICKET, DECIDED IN ONE PASS</text><g class="p-card p-step"><rect x="246.0" y="174.0" width="388.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(261.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="261.0" y="236.5" class="p-title" font-size="15.5">Ticket plus question</text><text x="261.0" y="257.5" class="p-line" font-size="13">Laya: a 421M encoder,</text><text x="261.0" y="275.5" class="p-line" font-size="13">about 33 ms a question</text><text x="261.0" y="293.5" class="p-line" font-size="13">on an NVIDIA T4</text></g><g class="p-card p-good"><rect x="22.0" y="363.0" width="388.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,378.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="37.0" y="425.5" class="p-title" font-size="15.5">Act on it</text><text x="37.0" y="446.5" class="p-line" font-size="13">Above the 0.9 bar,</text><text x="37.0" y="464.5" class="p-line" font-size="13">code routes it with</text><text x="37.0" y="482.5" class="p-line" font-size="13">no person involved</text></g><path d="M440.0,315.0 L216.0,357.0" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><rect x="271.6" y="327.0" width="112.7" height="18" rx="5" class="p-chip"/><text x="328.0" y="340.0" class="p-note" text-anchor="middle" font-size="11.5">refunds, p = 0.94</text><g class="p-card p-muted"><rect x="470.0" y="363.0" width="388.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(485.0,378.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M16 3h5v5M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3m12 6l6-6"/></g></g><text x="485.0" y="425.5" class="p-title" font-size="15.5">Hand it to a person</text><text x="485.0" y="446.5" class="p-line" font-size="13">The probability says</text><text x="485.0" y="464.5" class="p-line" font-size="13">when to stop trusting</text><text x="485.0" y="482.5" class="p-line" font-size="13">the answer</text></g><path d="M440.0,315.0 L664.0,357.0" class="p-arrow" marker-end="url(#p-head)"/><rect x="518.9" y="327.0" width="66.3" height="18" rx="5" class="p-chip"/><text x="552.0" y="340.0" class="p-note" text-anchor="middle" font-size="11.5">below 0.9</text></svg>
