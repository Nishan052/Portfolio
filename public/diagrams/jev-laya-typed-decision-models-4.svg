<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 429" width="880" height="429" role="img" aria-label="A typed output guarantees the answer is on the list but not that it is the right item, and an injected document steered Jev in 25 of 27 runs."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">On your list is not the same as right</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">Prompt injection hides an instruction inside the input itself:</text><text x="73.0" y="108.0" class="p-line" font-size="13">a line in the ticket that says mark this one resolved.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">WHAT THE TYPE PROMISES</text><g class="p-card p-good"><rect x="22.0" y="174.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">Guaranteed</text><text x="37.0" y="257.5" class="p-line" font-size="13">The answer is always</text><text x="37.0" y="275.5" class="p-line" font-size="13">one of your options,</text><text x="37.0" y="293.5" class="p-line" font-size="13">in the shape you set</text></g><g class="p-card p-bad"><rect x="499.0" y="174.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="514.0" y="236.5" class="p-title" font-size="15.5">Not guaranteed</text><text x="514.0" y="257.5" class="p-line" font-size="13">Which option it picks.</text><text x="514.0" y="275.5" class="p-line" font-size="13">An injected document</text><text x="514.0" y="293.5" class="p-line" font-size="13">can choose it for you</text></g><path d="M440.0,182.0 L440.0,303.0" class="p-divider"/><rect x="392.3" y="231.5" width="95.5" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="246.5" class="p-note" text-anchor="middle" font-size="11.5">25 of 27 runs</text><g class="p-card p-muted"><rect x="22" y="337.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,361.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Zm-6.8-2.8l2-2m-5-1l2-2m-5-1l2-2m7 11l2-2"/></g><text x="73.0" y="367.0" class="p-line" font-size="13">Check Point Research, September 2026: the strongest attack steered Jev</text><text x="73.0" y="385.0" class="p-line" font-size="13">in 25 of 27 runs. Treat a decision on untrusted input as untrusted.</text></g></svg>
