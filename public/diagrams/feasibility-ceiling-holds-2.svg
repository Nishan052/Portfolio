<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 406" width="880" height="406" role="img" aria-label="Reading 3.79 GB of weights at 100 GB per second takes 38 milliseconds, which caps a 7B model at 26.4 tokens per second on an Apple M2, against 21.9 measured."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">One token on a base M2 takes 38 milliseconds at best</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">ONE TOKEN ON AN APPLE M2 AT 100 GB/S</text><g class="p-card p-step"><rect x="22.0" y="78.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></g></g><text x="37.0" y="140.5" class="p-title" font-size="15.5">Read the weights</text><text x="37.0" y="161.5" class="p-line" font-size="13">3.79 GB</text><text x="37.0" y="179.5" class="p-line" font-size="13">out of memory</text></g><path d="M285.7,137.5 L305.7,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-muted"><rect x="310.7" y="78.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(325.7,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 20v2m0-20v2m5 16v2m0-20v2M2 12h2m-2 5h2M2 7h2m16 5h2m-2 5h2M20 7h2M7 20v2M7 2v2"/><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/></g></g><text x="325.7" y="140.5" class="p-title" font-size="15.5">Multiply and add</text><text x="325.7" y="161.5" class="p-line" font-size="13">About 13.5 billion</text><text x="325.7" y="179.5" class="p-line" font-size="13">operations</text></g><path d="M574.3,137.5 L594.3,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-good"><rect x="599.3" y="78.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(614.3,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g></g><text x="614.3" y="140.5" class="p-title" font-size="15.5">Time per token</text><text x="614.3" y="161.5" class="p-line" font-size="13">38 ms at best</text><text x="614.3" y="179.5" class="p-line" font-size="13">Ceiling 26.4 tokens/s</text></g><text x="440.0" y="216.0" class="p-note" text-anchor="middle" font-size="11.5">Llama 7B at Q4_0, 6.74 billion weights at 4.5 bits. Measured on this chip: 21.9 tokens per second (llama.cpp discussion 4167).</text><text x="22.0" y="258.0" class="p-band" font-size="11.5">WHAT MOVES THE CEILING</text><g class="p-card p-step"><rect x="22.0" y="265.0" width="264.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,280.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Zm-6.8-2.8l2-2m-5-1l2-2m-5-1l2-2m7 11l2-2"/></g><text x="37.0" y="327.5" class="p-title" font-size="15.5">Bits per weight</text><text x="37.0" y="348.5" class="p-line" font-size="13">Halve them and the</text><text x="37.0" y="366.5" class="p-line" font-size="13">ceiling roughly doubles</text></g><g class="p-card p-step"><rect x="308.0" y="265.0" width="264.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(323.0,280.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g></g><text x="323.0" y="327.5" class="p-title" font-size="15.5">Context length</text><text x="323.0" y="348.5" class="p-line" font-size="13">4,096 tokens adds about</text><text x="323.0" y="366.5" class="p-line" font-size="13">2 GB of cache to read</text></g><g class="p-card p-step"><rect x="594.0" y="265.0" width="264.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(609.0,280.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"/></g><text x="609.0" y="327.5" class="p-title" font-size="15.5">Bandwidth</text><text x="609.0" y="348.5" class="p-line" font-size="13">100 GB/s to 800 GB/s</text><text x="609.0" y="366.5" class="p-line" font-size="13">raises the ceiling 8 times</text></g></svg>
