<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 339" width="880" height="339" role="img" aria-label="Apple's own M1, M1 Pro, M1 Max and M1 Ultra chips span 83 percent down to 40 percent efficiency, and all three two-die Ultra chips reach only 40 to 45 percent. A single decode stream may not be able to keep two dies busy."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">One vendor's own chips already span 83 to 40 percent</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">EFFICIENCY ACROSS ONE VENDOR'S OWN LINEUP</text><g class="p-card p-good"><rect x="22.0" y="78.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,93.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"/></g><text x="37.0" y="140.5" class="p-title" font-size="15.5">M2 (base)</text><text x="37.0" y="161.5" class="p-line" font-size="13">83 percent</text><text x="37.0" y="179.5" class="p-line" font-size="13">One die</text></g><path d="M285.7,137.5 L305.7,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-step"><rect x="310.7" y="78.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(325.7,93.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"/></g><text x="325.7" y="140.5" class="p-title" font-size="15.5">M1 Pro / Max</text><text x="325.7" y="161.5" class="p-line" font-size="13">69 to 58 percent</text><text x="325.7" y="179.5" class="p-line" font-size="13">One die</text></g><path d="M574.3,137.5 L594.3,137.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-bad"><rect x="599.3" y="78.0" width="258.7" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(614.3,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M10 12h4m-4 5h4M10 7h4m4 5h2m-2 6h2M18 6h2M4 12h2m-2 6h2M4 6h2"/><rect width="12" height="20" x="6" y="2" rx="2"/></g></g><text x="614.3" y="140.5" class="p-title" font-size="15.5">Ultra, two dies</text><text x="614.3" y="161.5" class="p-line" font-size="13">40, 45 and 44 percent</text><text x="614.3" y="179.5" class="p-line" font-size="13">M1, M2 and M3 Ultra</text></g><text x="440.0" y="216.0" class="p-note" text-anchor="middle" font-size="11.5">Share of each chip's own bandwidth ceiling a single decode stream actually reaches.</text><g class="p-card p-bad"><rect x="22" y="247.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,271.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="73.0" y="277.0" class="p-line" font-size="13">Every two-die Ultra reaches only 40 to 45 percent of its ceiling.</text><text x="73.0" y="295.0" class="p-line" font-size="13">A likely reason: one decode stream cannot keep both dies fed.</text></g></svg>
