<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 351" width="880" height="351" role="img" aria-label="A spec sheet advertises compute in operations per second, but generating one token reads every weight of the model from memory once, so memory bandwidth decides how fast a model talks."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">The chip waits for memory, so bandwidth sets the speed</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">TWO COLUMNS ON A SPEC SHEET</text><g class="p-card p-muted"><rect x="22.0" y="78.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 20v2m0-20v2m5 16v2m0-20v2M2 12h2m-2 5h2M2 7h2m16 5h2m-2 5h2M20 7h2M7 20v2M7 2v2"/><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="8" height="8" x="8" y="8" rx="1"/></g></g><text x="37.0" y="140.5" class="p-title" font-size="15.5">Compute, in operations per second</text><text x="37.0" y="161.5" class="p-line" font-size="13">A token needs about two operations</text><text x="37.0" y="179.5" class="p-line" font-size="13">for each weight in the model</text><text x="37.0" y="197.5" class="p-line" font-size="13">The chip finishes early and waits</text><text x="37.0" y="215.5" class="p-line" font-size="13">Barely moves the speed</text></g><g class="p-card p-good"><rect x="499.0" y="78.0" width="359.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 12v-2m0 8v-2m4-4v-2m0 8v-2M2 11h1.5M20 18v-2m.5-5H22M4 18v-2m4-4v-2m0 8v-2"/><rect width="20" height="10" x="2" y="6" rx="2"/></g></g><text x="514.0" y="140.5" class="p-title" font-size="15.5">Bandwidth, in gigabytes per second</text><text x="514.0" y="161.5" class="p-line" font-size="13">Every token reads all 3.79 GB of a</text><text x="514.0" y="179.5" class="p-line" font-size="13">7B model stored at 4.5 bits per weight</text><text x="514.0" y="197.5" class="p-line" font-size="13">The read is the whole cost</text><text x="514.0" y="215.5" class="p-line" font-size="13">This sets the speed</text></g><path d="M440.0,86.0 L440.0,225.0" class="p-divider"/><rect x="395.2" y="144.5" width="89.7" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="159.5" class="p-note" text-anchor="middle" font-size="11.5">work vs wait</text><g class="p-card p-step"><rect x="22" y="259.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,283.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"/></g><text x="73.0" y="289.0" class="p-line" font-size="13">Single-stream text generation reads each weight once per token.</text><text x="73.0" y="307.0" class="p-line" font-size="13">The chip waits for memory, so the bandwidth column predicts the speed.</text></g></svg>
