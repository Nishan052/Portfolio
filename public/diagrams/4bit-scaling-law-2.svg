<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 520" width="880" height="520" role="img" aria-label="Across roughly 35,000 runs from 19 million to 176 billion parameters, four-bit weights give the most accuracy per bit stored, and below four bits the trade reverses."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Four bits is a peak, not a direction of travel</text><g class="p-card p-step"><rect x="22" y="60.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,84.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="73.0" y="90.0" class="p-line" font-size="13">More bits are always at least as good, if you ignore what they cost.</text><text x="73.0" y="108.0" class="p-line" font-size="13">A fixed budget does not ignore it, so the measure has to be accuracy per bit.</text></g><text x="22.0" y="167.0" class="p-band" font-size="11.5">ACCURACY PER BIT, SWEPT</text><g class="p-card p-muted"><rect x="22.0" y="174.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="4" height="6" x="14" y="14" rx="2"/><rect width="4" height="6" x="6" y="4" rx="2"/><path d="M6 20h4m4-10h4M6 14h2v6m6-16h2v6"/></g></g><text x="37.0" y="236.5" class="p-title" font-size="15.5">16 bits</text><text x="37.0" y="257.5" class="p-line" font-size="13">Precision nobody</text><text x="37.0" y="275.5" class="p-line" font-size="13">on a device can afford</text></g><path d="M213.5,233.5 L233.5,233.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-muted"><rect x="238.5" y="174.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(253.5,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="4" height="6" x="14" y="14" rx="2"/><rect width="4" height="6" x="6" y="4" rx="2"/><path d="M6 20h4m4-10h4M6 14h2v6m6-16h2v6"/></g></g><text x="253.5" y="236.5" class="p-title" font-size="15.5">8 bits</text><text x="253.5" y="257.5" class="p-line" font-size="13">The usual default,</text><text x="253.5" y="275.5" class="p-line" font-size="13">and beaten</text></g><path d="M430.0,233.5 L450.0,233.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-good"><rect x="455.0" y="174.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(470.0,189.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g></g><text x="470.0" y="236.5" class="p-title" font-size="15.5">4 bits</text><text x="470.0" y="257.5" class="p-line" font-size="13">Best accuracy per bit</text><text x="470.0" y="275.5" class="p-line" font-size="13">at almost every scale</text></g><path d="M646.5,233.5 L666.5,233.5" class="p-arrow" marker-end="url(#p-head)"/><g class="p-card p-bad"><rect x="671.5" y="174.0" width="186.5" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(686.5,189.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="686.5" y="236.5" class="p-title" font-size="15.5">3 bits</text><text x="686.5" y="257.5" class="p-line" font-size="13">Worse than 4, even</text><text x="686.5" y="275.5" class="p-line" font-size="13">with a bigger model</text></g><text x="440.0" y="312.0" class="p-note" text-anchor="middle" font-size="11.5">Dettmers and Zettlemoyer, roughly 35,000 runs, 19M to 176B parameters, 16 bits down to 3.</text><text x="22.0" y="354.0" class="p-band" font-size="11.5">WHERE IT TURNS</text><g class="p-card p-good"><rect x="22.0" y="361.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,376.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g></g><text x="37.0" y="423.5" class="p-title" font-size="15.5">Down to four bits</text><text x="37.0" y="444.5" class="p-line" font-size="13">The weights you buy are</text><text x="37.0" y="462.5" class="p-line" font-size="13">worth more than the</text><text x="37.0" y="480.5" class="p-line" font-size="13">precision you give up</text></g><g class="p-card p-bad"><rect x="499.0" y="361.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,376.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="514.0" y="423.5" class="p-title" font-size="15.5">Below four bits</text><text x="514.0" y="444.5" class="p-line" font-size="13">Accuracy lost per weight</text><text x="514.0" y="462.5" class="p-line" font-size="13">grows faster than the</text><text x="514.0" y="480.5" class="p-line" font-size="13">capacity the bits buy</text></g><path d="M440.0,369.0 L440.0,490.0" class="p-divider"/><rect x="377.7" y="418.5" width="124.5" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="433.5" class="p-note" text-anchor="middle" font-size="11.5">the trade reverses</text></svg>
