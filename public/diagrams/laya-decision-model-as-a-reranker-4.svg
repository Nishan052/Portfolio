<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 522" width="880" height="522" role="img" aria-label="One user question splits two ways: asked once per question, Laya catches off-topic questions in about 218 milliseconds, asked once per passage it takes 2.7 seconds and ranks worse."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Ask once per question, not once per passage</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">THE SAME MODEL, TWO PLACES IN A RETRIEVAL PIPELINE</text><g class="p-card p-step"><rect x="246.0" y="78.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(261.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="261.0" y="140.5" class="p-title" font-size="15.5">One user question</text><text x="261.0" y="161.5" class="p-line" font-size="13">and the 20 passages</text><text x="261.0" y="179.5" class="p-line" font-size="13">search found for it</text></g><g class="p-card p-good"><rect x="22.0" y="249.0" width="388.0" height="155.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,264.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="37.0" y="311.5" class="p-title" font-size="15.5">Once per question</text><text x="37.0" y="332.5" class="p-line" font-size="13">Can these passages</text><text x="37.0" y="350.5" class="p-line" font-size="13">answer it at all?</text><text x="37.0" y="368.5" class="p-line" font-size="13">13 of 15 off-topic</text><text x="37.0" y="386.5" class="p-line" font-size="13">questions turned away</text></g><path d="M440.0,201.0 L216.0,243.0" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><rect x="274.5" y="213.0" width="106.9" height="18" rx="5" class="p-chip"/><text x="328.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">218 ms, one call</text><g class="p-card p-bad"><rect x="470.0" y="249.0" width="388.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(485.0,264.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></g></g><text x="485.0" y="311.5" class="p-title" font-size="15.5">Once per passage</text><text x="485.0" y="332.5" class="p-line" font-size="13">Which passage is best?</text><text x="485.0" y="350.5" class="p-line" font-size="13">17 of 49 first, below</text><text x="485.0" y="368.5" class="p-line" font-size="13">the search order</text></g><path d="M440.0,201.0 L664.0,243.0" class="p-arrow" marker-end="url(#p-head)"/><rect x="501.4" y="213.0" width="101.1" height="18" rx="5" class="p-chip"/><text x="552.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">2.7 s, 20 calls</text><g class="p-card p-step"><rect x="22" y="430.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,454.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M16 3h5v5M8 3H3v5"/><path d="M12 22v-8.3a4 4 0 0 0-1.172-2.872L3 3m12 6l6-6"/></g></g><text x="73.0" y="460.0" class="p-line" font-size="13">Rank with a cross-encoder trained to rank. Ask the decision model yes or no questions</text><text x="73.0" y="478.0" class="p-line" font-size="13">about the message itself, after fine-tuning it on your own examples.</text></g></svg>
