<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 333" width="880" height="333" role="img" aria-label="In-sample, a curve fit to 14 Apple measurements scored 14 of 14 within 30 percent. Applied to two held-out boards never shown to the fit, it missed both by about 49 percent, in the same direction."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">Fourteen of fourteen, then a miss on the first new chip</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">TWO REPORT CARDS, ONE CURVE</text><g class="p-card p-good"><rect x="22.0" y="78.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></g></g><text x="37.0" y="140.5" class="p-title" font-size="15.5">Scored on its own 14 chips</text><text x="37.0" y="161.5" class="p-line" font-size="13">14 of 14 within 30 percent</text><text x="37.0" y="179.5" class="p-line" font-size="13">Mean error 7 percent</text><text x="37.0" y="197.5" class="p-line" font-size="13">Looked like a working model</text></g><g class="p-card p-bad"><rect x="499.0" y="78.0" width="359.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(514.0,93.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m21.73 18l-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3M12 9v4m0 4h.01"/></g><text x="514.0" y="140.5" class="p-title" font-size="15.5">Scored on 2 chips it never saw</text><text x="514.0" y="161.5" class="p-line" font-size="13">Raspberry Pi 5 and Jetson</text><text x="514.0" y="179.5" class="p-line" font-size="13">Missed both by about 49 percent</text><text x="514.0" y="197.5" class="p-line" font-size="13">Same direction both times</text></g><path d="M440.0,86.0 L440.0,207.0" class="p-divider"/><rect x="371.9" y="135.5" width="136.2" height="22" rx="11" class="p-chip p-chip-strong"/><text x="440.0" y="150.5" class="p-note" text-anchor="middle" font-size="11.5">14/14 vs missed both</text><g class="p-card p-step"><rect x="22" y="241.0" width="836" height="70.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,265.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="m21 21l-4.34-4.34"/><circle cx="11" cy="11" r="8"/></g></g><text x="73.0" y="271.0" class="p-line" font-size="13">A fit that scores well on the points it was shown has proven it can</text><text x="73.0" y="289.0" class="p-line" font-size="13">describe those points. A held-out point is the only honest test left.</text></g></svg>
