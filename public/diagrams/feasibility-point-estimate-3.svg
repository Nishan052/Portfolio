<svg xmlns="http://www.w3.org/2000/svg" class="panel" viewBox="0 0 880 571" width="880" height="571" role="img" aria-label="One curve, fit to 14 Apple chips, goes in. On the chips it was fit to, it predicts well. On two chips it has never seen, it misses by about 49 percent, in the same direction."><defs><marker id="p-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="p-arrow-head"/></marker></defs><text x="22" y="39.0" class="p-heading" font-size="18">One curve in, two very different outcomes out</text><text x="22.0" y="71.0" class="p-band" font-size="11.5">WHAT THE CURVE ACTUALLY LEARNED</text><g class="p-card p-step"><rect x="246.0" y="78.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(261.0,93.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><rect width="4" height="6" x="14" y="14" rx="2"/><rect width="4" height="6" x="6" y="4" rx="2"/><path d="M6 20h4m4-10h4M6 14h2v6m6-16h2v6"/></g></g><text x="261.0" y="140.5" class="p-title" font-size="15.5">A curve fit to 14 Apple chips</text><text x="261.0" y="161.5" class="p-line" font-size="13">One vendor's memory</text><text x="261.0" y="179.5" class="p-line" font-size="13">designs, 14 chips</text></g><g class="p-card p-good"><rect x="22.0" y="249.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,264.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 6L9 17l-5-5"/></g><text x="37.0" y="311.5" class="p-title" font-size="15.5">Asked about an Apple chip</text><text x="37.0" y="332.5" class="p-line" font-size="13">It describes the chips</text><text x="37.0" y="350.5" class="p-line" font-size="13">it was fit to</text></g><path d="M440.0,201.0 L216.0,243.0" class="p-arrow p-arrow-live" marker-end="url(#p-head)"/><rect x="271.6" y="213.0" width="112.7" height="18" rx="5" class="p-chip"/><text x="328.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">within 30 percent</text><g class="p-card p-bad"><rect x="470.0" y="249.0" width="388.0" height="119.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(485.0,264.0) scale(0.9167)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929L19.07 19.071"/></g></g><text x="485.0" y="311.5" class="p-title" font-size="15.5">Asked about a Pi or a Jetson</text><text x="485.0" y="332.5" class="p-line" font-size="13">The miss goes the</text><text x="485.0" y="350.5" class="p-line" font-size="13">same way both times</text></g><path d="M440.0,201.0 L664.0,243.0" class="p-arrow" marker-end="url(#p-head)"/><rect x="486.9" y="213.0" width="130.2" height="18" rx="5" class="p-chip"/><text x="552.0" y="226.0" class="p-note" text-anchor="middle" font-size="11.5">missed by 49 percent</text><text x="22.0" y="405.0" class="p-band" font-size="11.5">WHAT SHIPPED INSTEAD</text><g class="p-card p-step"><rect x="22.0" y="412.0" width="264.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(37.0,427.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Zm-6.8-2.8l2-2m-5-1l2-2m-5-1l2-2m7 11l2-2"/></g><text x="37.0" y="474.5" class="p-title" font-size="15.5">A hard ceiling</text><text x="37.0" y="495.5" class="p-line" font-size="13">Never exceeded by</text><text x="37.0" y="513.5" class="p-line" font-size="13">any of 16</text><text x="37.0" y="531.5" class="p-line" font-size="13">published figures</text></g><g class="p-card p-step"><rect x="308.0" y="412.0" width="264.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(323.0,427.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m12 14l4-4M3.34 19a10 10 0 1 1 17.32 0"/></g><text x="323.0" y="474.5" class="p-title" font-size="15.5">A band, not a point</text><text x="323.0" y="495.5" class="p-line" font-size="13">38 to 85 percent</text><text x="323.0" y="513.5" class="p-line" font-size="13">of that ceiling,</text><text x="323.0" y="531.5" class="p-line" font-size="13">holds all 16</text></g><g class="p-card p-step"><rect x="594.0" y="412.0" width="264.0" height="137.0" rx="12" class="p-card-bg"/><g class="p-icon" transform="translate(609.0,427.0) scale(0.9167)"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7V5a2 2 0 0 1 2-2h2m10 0h2a2 2 0 0 1 2 2v2m0 10v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2m4-5h10"/></g><text x="609.0" y="474.5" class="p-title" font-size="15.5">Scored on all 16</text><text x="609.0" y="495.5" class="p-line" font-size="13">The ceiling holds on</text><text x="609.0" y="513.5" class="p-line" font-size="13">every figure, the two</text><text x="609.0" y="531.5" class="p-line" font-size="13">held-out boards included</text></g></svg>
