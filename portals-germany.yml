# Germany Portal Scanner Configuration
# Customised for: Nishan Chandrashekar Poojary — Berlin, Germany
# Target roles: Software Development · Frontend Development · AI/ML · Data Science
# Geography: Germany only (Berlin · Munich · Hamburg · Cologne · Frankfurt · Heidelberg · Freiburg · Düsseldorf)
#
# Strategy (3 levels):
#   1. Playwright → careers_url of each company (real-time, reliable)
#   2. Greenhouse API → structured JSON (fast, Greenhouse-only)
#   3. WebSearch with site: filters (broad discovery, may be stale)
#
# IMPORTANT: Each company in tracked_companies MUST have careers_url.
#
# HOW TO CUSTOMIZE:
#   1. Copy this file to portals-germany.yml in the project root
#   2. Edit title_filter.positive with YOUR target role keywords
#   3. Add/remove companies in tracked_companies
#   4. Adjust search_queries for your preferred job boards
#   5. Set enabled: false on companies you don't care about

# -- Title filter --
# The scanner uses these keywords to decide if a title is relevant.
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- Entry-level, Internship, Werkstudent, Thesis --
    - "Intern"
    - "Internship"
    - "Praktikant"
    - "Praktikantin"
    - "Praktikum"
    - "Werkstudent"
    - "Werkstudentin"
    - "Working Student"
    - "Junior"
    - "Junior Developer"
    - "Junior Engineer"
    - "Trainee"
    - "Thesis"
    - "Bachelor Thesis"
    - "Master Thesis"
    - "Bachelorarbeit"
    - "Masterarbeit"
    - "Abschlussarbeit"
    - "Student"
    - "Graduate"
    - "Entry Level"
    - "Entry-Level"
    # -- Software Engineering --
    - "Software Engineer"
    - "Software Developer"
    - "Softwareentwickler"
    - "Softwareingenieur"
    - "Entwickler"
    - "Developer"
    # -- Frontend --
    - "Frontend"
    - "Front-End"
    - "Front End"
    - "UI Engineer"
    - "React"
    - "Angular"
    - "Vue"
    - "TypeScript"
    # -- Full Stack --
    - "Full Stack"
    - "Fullstack"
    # -- Backend (relevant to software dev) --
    - "Backend"
    - "Back-End"
    - "Platform Engineer"
    # -- Python / Data Engineering --
    - "Python"
    - "Data Engineer"
    - "Analytics Engineer"
    - "ETL"
    # -- Data Science --
    - "Data Scientist"
    - "Data Science"
    - "Data Analyst"
    # -- AI / ML --
    - "AI"
    - "ML"
    - "Machine Learning"
    - "Deep Learning"
    - "LLM"
    - "NLP"
    - "Computer Vision"
    - "MLOps"
    - "GenAI"
    - "Generative AI"
    - "Applied AI"
    # -- German AI/ML keywords (DACH market) --
    - "KI"
    - "Künstliche Intelligenz"
    - "KI Engineer"
    - "KI Entwickler"
    - "Maschinelles Lernen"
  negative:
    # Exclude non-technical only
    - "Ausbildung"
    - "Apprentice"
    # Exclude non-target functions
    - "Sales"
    - "Account Executive"
    - "Account Manager"
    - "Business Development"
    - "Marketing"
    - "Copywriter"
    - "Finance"
    - "Accounting"
    - "HR "
    - "Recruiter"
    - "Talent Acquisition"
    - "Legal"
    - "Counsel"
    - "Office Manager"
    - "Operations Manager"
    - "Customer Success"
    - "Customer Support"
    # Exclude irrelevant tech stacks
    - "iOS"
    - "Android"
    - "Embedded"
    - "Firmware"
    - "FPGA"
    - "COBOL"
    - "SAP "
    - "Mainframe"
    - "PHP"
    - "Ruby"
    - "Blockchain"
    - "Web3"
    - "Crypto"
  seniority_boost:
    # Entry-level boosts (also relevant)
    - "Junior"
    - "Werkstudent"
    - "Working Student"
    - "Intern"
    - "Thesis"
    - "Masterarbeit"
    - "Bachelorarbeit"

# -- Search queries --
# Each query triggers a WebSearch. Use site: to filter by portal.
# The scanner extracts title, URL, and company from results.

search_queries:
  # -- Werkstudent / Internship / Thesis / Junior --
  - name: StepStone — Werkstudent AI/Data/Frontend Germany
    query: 'site:stepstone.de "Werkstudent" OR "Working Student" "AI" OR "Machine Learning" OR "Data" OR "Frontend" OR "Software" Germany'
    enabled: true

  - name: StepStone — Junior Software/AI/Data Germany
    query: 'site:stepstone.de "Junior" "Software Engineer" OR "AI Engineer" OR "Data Scientist" OR "Frontend" OR "ML Engineer" Germany'
    enabled: true

  - name: StepStone — Praktikum AI/Data/Software Germany
    query: 'site:stepstone.de "Praktikum" OR "Praktikant" "AI" OR "Software" OR "Data" OR "Machine Learning" OR "Frontend" Germany'
    enabled: true

  - name: StepStone — Masterarbeit / Bachelor Thesis Germany
    query: 'site:stepstone.de "Masterarbeit" OR "Bachelorarbeit" OR "Abschlussarbeit" OR "Master Thesis" OR "Bachelor Thesis" "AI" OR "Software" OR "Data" OR "Machine Learning" Germany'
    enabled: true

  - name: Indeed.de — Werkstudent AI/Data/Frontend Germany
    query: 'site:de.indeed.com "Werkstudent" OR "Working Student" "AI" OR "Machine Learning" OR "Data" OR "Frontend" OR "Software" Germany'
    enabled: true

  - name: Indeed.de — Junior AI/Data/Software Germany
